<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
        background: #fffaf4;
        color: #6b5436;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #fffaf4;
      }

      #app {
        min-height: 100vh;
      }

      .app-boot {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background:
          radial-gradient(circle at top, rgba(255, 199, 103, 0.16), transparent 42%),
          linear-gradient(180deg, #fff8ee 0%, #fffdf9 100%);
      }

      .app-boot-logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 88px;
        height: 44px;
        padding: 0 18px;
        border-radius: 999px;
        background: linear-gradient(180deg, #ffd06d, #ffaf29);
        color: #523713;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.02em;
        box-shadow: 0 12px 28px rgba(255, 175, 41, 0.22);
      }

      .app-boot-spinner {
        width: 24px;
        height: 24px;
        border: 3px solid rgba(255, 171, 37, 0.22);
        border-top-color: #ffab25;
        border-radius: 50%;
        animation: app-boot-spin 0.9s linear infinite;
      }

      .app-boot-text {
        font-size: 14px;
        color: #8c7458;
      }

      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <title>800AI - AI生图平台</title>
  </head>
  <body>
    <div id="app">
      <div class="app-boot">
        <div class="app-boot-logo">800AI</div>
        <div class="app-boot-spinner" aria-hidden="true"></div>
        <div class="app-boot-text">页面加载中...</div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
